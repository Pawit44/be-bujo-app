services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bujo
      POSTGRES_PASSWORD: bujo
      POSTGRES_DB: bujo
    ports:
      - "55432:5432"
    volumes:
      - bujo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bujo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bujo-postgres-data:
